<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Профил — ЯТО</title>
<meta name="theme-color" content="#101214">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
  .stats{display:flex;gap:8px;margin-top:16px}
  .stats div{flex:1;background:rgba(0,0,0,.3);border:1px solid var(--graphite);
    border-radius:12px;padding:10px 8px}
  .stats b{font-family:var(--display);font-size:21px;display:block;line-height:1.1}
  .stats span{font-size:9.5px;color:var(--ash);text-transform:uppercase;letter-spacing:.07em}
  .sbar{margin-bottom:15px}
  .sbar .lb{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
  .bar .lb b{font-size:13.5px;font-weight:600}
  .bar .lb i{font-style:normal;font-family:var(--display);font-size:15px}
  .track{height:8px;border-radius:100px;background:var(--graphite);overflow:hidden}
  .fill{height:100%;border-radius:100px;background:linear-gradient(90deg,#C8D400,#F1FF00)}
  .fill.g{background:linear-gradient(90deg,#99582A,#FBB03B)}
  .sbar .nt{font-size:11px;color:var(--ash);margin-top:5px}
  .more{display:flex;align-items:center;gap:12px;background:var(--charcoal);
    border:1px solid var(--graphite);border-radius:14px;padding:14px 15px;margin-bottom:8px;
    text-decoration:none;transition:border-color .15s}
  a.more:hover{border-color:var(--graphite2)}
  .more.off{opacity:.55}
  .more .ic{width:32px;height:32px;border-radius:10px;flex:none;display:flex;align-items:center;
    justify-content:center;background:var(--graphite);font-size:15px}
  .more .tx b{display:block;font-size:14px;font-weight:600;line-height:1.3}
  .more .tx span{display:block;color:var(--ash);font-size:12px;margin-top:1px}
  .more .rt{margin-left:auto;flex:none;color:var(--ash);font-size:11.5px}
</style>
</head>
<body>
<header><div class="wrap"><div class="bar"></div></div></header>
<main><div class="wrap" id="root"><div class="skeleton" style="height:120px"></div><div class="skeleton"></div></div></main>
<nav class="tabs"></nav>

<script type="module">
import { sb, configured, $, esc, mountChrome, requireAuth, initials, igHandle,
         show, hide, signOut, renderNotConfigured } from "./app.js";

/* Лента спрямо най-доброто, което ЯТО познава. Не измисляме норми —
   сравняваме с истинските числа на истинските профили тук.        */
function bar(label, mine, all, unit = "кг", lowerBetter = false) {
  if (!(Number(mine) > 0)) return "";
  const vals = all.filter(v => Number(v) > 0).map(Number);
  const best = lowerBetter ? Math.min(...vals) : Math.max(...vals);
  const pct = Math.max(6, Math.min(100, Math.round(
    (lowerBetter ? best / Number(mine) : Number(mine) / best) * 100)));
  const better = vals.filter(v => lowerBetter ? v < mine : v > mine).length;
  const fmt = (v) => unit === "мм:сс"
    ? `${Math.floor(v / 60)}:${String(Math.round(v % 60)).padStart(2, "0")}`
    : `${v} ${unit}`;
  return `
    <div class="sbar">
      <div class="lb"><b>${esc(label)}</b><i class="tnum">${esc(fmt(Number(mine)))}</i></div>
      <div class="track"><div class="fill ${pct >= 100 ? "" : "g"}" style="width:${pct}%"></div></div>
      <div class="nt">${vals.length === 1
        ? "Засега само ти си попълнил това"
        : better === 0
          ? `Най-доброто в ЯТО от ${vals.length} попълнени`
          : `№${better + 1} от ${vals.length} попълнени · най-доброто е ${esc(fmt(best))}`}</div>
    </div>`;
}

if (!configured) { mountChrome({ title:"Профил", active:"me" }); renderNotConfigured(); }
else {
  const p = await requireAuth();
  if (p) {
    mountChrome({ title: "Профил", active: "me", profile: p });

    const opt = (v, cur) => `<option ${v === (cur || "") ? "selected" : ""}>${esc(v)}</option>`;
    const val = (v) => v ?? "";

    // всичко долу е сметнато от истински редове, не от кръгли числа
    const [{ data: myComps }, { data: myMatches }, { data: everyone }] = await Promise.all([
      sb.from("attendances").select("*, competitions(*)").eq("profile_id", p.id),
      sb.from("matches").select("*"),
      sb.from("profiles").select("snatch_kg, clean_jerk_kg, back_squat_kg, fran_seconds, strict_pullups"),
    ]);

    const comps = (myComps || []).filter(a => a.competitions);
    const countries = new Set(comps.map(a => a.competitions.country).filter(Boolean));
    const col = (k) => (everyone || []).map(x => x[k]);

    const statsHtml = `
      <div class="stats">
        <div><b class="tnum">${comps.length}</b><span>Състезания</span></div>
        <div><b class="tnum">${(myMatches || []).length}</b><span>Съвпадения</span></div>
        <div><b class="tnum">${countries.size}</b><span>Държави</span></div>
      </div>`;

    const barsHtml = [
      bar("Snatch", p.snatch_kg, col("snatch_kg")),
      bar("Clean & Jerk", p.clean_jerk_kg, col("clean_jerk_kg")),
      bar("Back squat", p.back_squat_kg, col("back_squat_kg")),
      bar("Строги набирания", p.strict_pullups, col("strict_pullups"), "бр."),
      bar("Fran", p.fran_seconds, col("fran_seconds"), "мм:сс", true),
    ].join("");

    // съотношение snatch : клек — истинска треньорска проверка
    const ratio = (Number(p.snatch_kg) > 0 && Number(p.back_squat_kg) > 0)
      ? Math.round((Number(p.snatch_kg) / Number(p.back_squat_kg)) * 100) : null;
    const ratioHtml = ratio === null ? "" : `
      <div class="card" style="margin-top:2px">
        <div class="lb" style="display:flex;justify-content:space-between;align-items:baseline">
          <b style="font-size:13.5px">Snatch спрямо клека</b>
          <i style="font-style:normal;font-family:var(--display);font-size:15px" class="tnum">${ratio}%</i>
        </div>
        <p class="tiny" style="margin-top:7px">${
          ratio < 55 ? "Силата я имаш, техниката изостава. Повече работа по вдигането, по-малко по клека."
          : ratio > 72 ? "Техниката ти изпреварва силата. Клекът е това, което ще вдигне тавана."
          : "В добро съотношение — силата и техниката вървят заедно."}</p>
      </div>`;

    $("#root").innerHTML = `
      <div class="card" style="text-align:center;background:linear-gradient(150deg,rgba(241,255,0,.10),transparent 60%),var(--charcoal)">
        <div class="ava y" style="width:72px;height:72px;border-radius:50%;font-size:24px;margin:4px auto 12px">${esc(initials(p.name || p.email))}</div>
        <div class="d" style="font-size:20px">${esc(p.name || "Без име")}</div>
        <div class="muted">${esc(p.email || "")}</div>
        ${p.is_admin ? `<span class="pill em" style="margin-top:9px">Админ</span>` : ""}
        ${statsHtml}
      </div>

      <div class="msg" id="msg"></div>

      ${barsHtml ? `<div class="eyebrow">Къде си спрямо ятото</div>
        <div class="card">${barsHtml}
          <p class="tiny">Сравнението е с профилите в ЯТО, не с световни норми.
          Колкото повече хора влязат, толкова по-истинско става.</p>
        </div>${ratioHtml}` : ""}


      <div class="eyebrow">Кой си</div>
      <div class="card">
        <div class="field"><label for="name">Име</label><input id="name" maxlength="60" value="${esc(val(p.name))}" placeholder="Име и фамилия"></div>
        <div class="grid2">
          <div class="field"><label for="city">Град</label>
            <select id="city">${["", "София","Пловдив","Варна","Бургас","Русе","Стара Загора","Друг в България","В чужбина"].map(v => opt(v, p.city)).join("")}</select></div>
          <div class="field"><label for="division">Дивизия</label>
            <select id="division">${["", "RX","Scaled","Masters 35+","Не се състезавам още"].map(v => opt(v, p.division)).join("")}</select></div>
        </div>
        <div class="field"><label for="gym">Зала</label><input id="gym" maxlength="60" value="${esc(val(p.gym))}" placeholder="напр. CrossFit 681"></div>
        <div class="field">
          <label for="instagram">Instagram</label>
          <input id="instagram" maxlength="60" value="${esc(val(p.instagram))}" placeholder="@potrebitel">
          <p class="tiny" style="margin-top:6px">Това е единственият начин някой да се свърже с теб.
          Чат в приложението няма нарочно — така никой не пази съобщенията ти и няма кой да ти спами.</p>
        </div>
        <div class="field"><label for="bio">За теб (по избор)</label><textarea id="bio" maxlength="280" placeholder="Какво търсиш, какво ти е силното">${esc(val(p.bio))}</textarea></div>
      </div>

      <div class="eyebrow">Профил на силата</div>
      <div class="card">
        <p class="tiny" style="margin-bottom:14px">По тези числа те свързваме с хора на твоето ниво.
        Дръж ги честни — 60% съвпадение боли повече на състезанието, отколкото в приложението.</p>
        <div class="grid2">
          <div class="field"><label for="snatch">Snatch (кг)</label><input type="number" inputmode="decimal" id="snatch" value="${esc(val(p.snatch_kg))}"></div>
          <div class="field"><label for="cj">Clean &amp; Jerk (кг)</label><input type="number" inputmode="decimal" id="cj" value="${esc(val(p.clean_jerk_kg))}"></div>
          <div class="field"><label for="bs">Back squat (кг)</label><input type="number" inputmode="decimal" id="bs" value="${esc(val(p.back_squat_kg))}"></div>
          <div class="field"><label for="pu">Строги набирания</label><input type="number" inputmode="numeric" id="pu" value="${esc(val(p.strict_pullups))}"></div>
        </div>
        <div class="field"><label for="fran">Fran (мм:сс)</label><input id="fran" placeholder="3:24" value="${p.fran_seconds ? Math.floor(p.fran_seconds/60) + ":" + String(p.fran_seconds%60).padStart(2,"0") : ""}"></div>
      </div>

      <button class="btn" id="save">Запази</button>

      <div class="eyebrow">Още</div>
      <a class="more" href="team.html">
        <div class="ic">◇</div>
        <div class="tx"><b>Намери ято</b><span>Съотборници на твоето ниво</span></div>
        <div class="rt">›</div>
      </a>
      <a class="more" href="competitions.html">
        <div class="ic">▤</div>
        <div class="tx"><b>Календар</b><span>Всички състезания</span></div>
        <div class="rt">›</div>
      </a>
      <div class="more off">
        <div class="ic">◐</div>
        <div class="tx"><b>Часовник и пулсомер</b><span>Garmin, Polar, Apple Watch</span></div>
        <div class="rt">Фаза 2</div>
      </div>
      <div class="more off">
        <div class="ic">◈</div>
        <div class="tx"><b>Хранене и добавки</b><span>Планове от Ванеса и Марина</span></div>
        <div class="rt">Фаза 2</div>
      </div>
      <div class="more off">
        <div class="ic">▲</div>
        <div class="tx"><b>Лагери</b><span>Тренировъчни лагери в БГ и Европа</span></div>
        <div class="rt">Фаза 2</div>
      </div>

      <button class="btn ghost" id="out" style="margin-top:6px">Излез</button>

      <p class="tiny" style="margin:18px 0 4px">Профилът ти (без имейла) се вижда от другите вписани атлети.
      Това е нужно, за да те намерят за отбор.</p>
    `;

    $("#save").addEventListener("click", async () => {
      const btn = $("#save"); btn.disabled = true; btn.textContent = "Записваме…"; hide($("#msg"));

      const num = (id) => { const v = $(id).value.trim(); return v === "" ? null : Number(v); };
      const fran = (() => {
        const v = $("#fran").value.trim();
        if (!v) return null;
        const m = v.match(/^(\d+):([0-5]\d)$/);
        return m ? Number(m[1]) * 60 + Number(m[2]) : null;
      })();

      if ($("#fran").value.trim() && fran === null) {
        btn.disabled = false; btn.textContent = "Запази";
        return show($("#msg"), "Fran се пише като 3:24 — минути двоеточие секунди.", "err");
      }

      const patch = {
        name: $("#name").value.trim() || null,
        city: $("#city").value || null,
        division: $("#division").value || null,
        gym: $("#gym").value.trim() || null,
        instagram: igHandle($("#instagram").value) || null,
        bio: $("#bio").value.trim() || null,
        snatch_kg: num("#snatch"), clean_jerk_kg: num("#cj"),
        back_squat_kg: num("#bs"), strict_pullups: num("#pu"),
        fran_seconds: fran,
      };

      const { error } = await sb.from("profiles").update(patch).eq("id", p.id);
      btn.disabled = false; btn.textContent = "Запази";
      if (error) { console.error(error); show($("#msg"), "Не се записа. Пробвай пак.", "err"); }
      else { show($("#msg"), "Записано.", "ok"); setTimeout(() => location.reload(), 700); }
    });

    $("#out").addEventListener("click", signOut);
  }
}
</script>
</body>
</html>

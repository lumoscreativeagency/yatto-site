<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ЯТО</title>
<meta name="theme-color" content="#101214">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
  .next{position:relative;border-radius:20px;padding:20px;border:1px solid rgba(241,255,0,.28);
    background:linear-gradient(150deg,rgba(241,255,0,.20),rgba(241,255,0,.03) 56%,transparent),var(--charcoal);margin-bottom:6px}
  .next .cd{font-family:var(--display);font-size:52px;line-height:.9;font-weight:700;margin:10px 0 2px}
  .next .cd small{font-size:14px;color:var(--steel);font-weight:500;margin-left:7px}
  .mini{display:flex;gap:8px;margin-top:14px}
  .mini div{flex:1;background:rgba(0,0,0,.32);border:1px solid var(--graphite);border-radius:11px;padding:9px 10px}
  .mini b{font-family:var(--display);font-size:17px;display:block;line-height:1.15}
  .mini span{font-size:9.5px;color:var(--ash);text-transform:uppercase;letter-spacing:.08em}

  /* внимание */
  .alert{display:flex;gap:12px;align-items:flex-start;background:var(--charcoal);
    border:1px solid var(--graphite);border-left:3px solid var(--warn);border-radius:14px;
    padding:13px 15px;margin-bottom:8px;text-decoration:none;transition:border-color .15s}
  .alert:hover{border-color:var(--graphite2);border-left-color:var(--warn)}
  .alert.dg{border-left-color:var(--danger)}
  .alert.dg:hover{border-left-color:var(--danger)}
  .alert .ic{width:26px;height:26px;border-radius:9px;flex:none;display:flex;align-items:center;
    justify-content:center;font-size:14px;font-weight:700;background:rgba(251,176,59,.15);color:var(--warn);
    font-family:var(--display);margin-top:1px}
  .alert.dg .ic{background:rgba(255,59,92,.14);color:var(--danger)}
  .alert .tx{min-width:0}
  .alert .tx b{display:block;font-size:14px;font-weight:600;line-height:1.35}
  .alert .tx span{display:block;color:var(--steel);font-size:12.5px;margin-top:2px}
  .alert .arw{margin-left:auto;color:var(--ash);flex:none;align-self:center}

  /* отиват с теб */
  .withyou{display:flex;gap:10px;overflow-x:auto;padding:2px 18px 4px;margin:0 -18px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .withyou::-webkit-scrollbar{display:none}
  .wy{flex:none;width:126px;background:var(--charcoal);border:1px solid var(--graphite);
    border-radius:15px;padding:13px 12px;text-decoration:none;transition:border-color .15s}
  .wy:hover{border-color:var(--graphite2)}
  .wy .ava{width:38px;height:38px;border-radius:12px;font-size:13px;margin-bottom:9px}
  .wy .nm{font-size:13px;font-weight:600;line-height:1.25;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .wy .cm{color:var(--ash);font-size:11px;margin-top:4px;
    display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
</style>
</head>
<body>
<header><div class="wrap"><div class="bar"></div></div></header>
<main><div class="wrap" id="root"><div class="skeleton" style="height:170px"></div><div class="skeleton"></div></div></main>
<nav class="tabs"></nav>

<script type="module">
import { sb, configured, $, esc, mountChrome, requireAuth, dayNum, monthShort,
         dateRange, daysUntil, initials, renderNotConfigured, profileNudge } from "./app.js";

if (!configured) { mountChrome({ title:"ЯТО", active:"home" }); renderNotConfigured(); }
else {
  const profile = await requireAuth();
  if (profile) {
    const first = (profile.name || "").split(" ")[0];
    mountChrome({ title: first ? `Здравей, ${first}` : "Здравей", active: "home", profile });

    const today = new Date().toISOString().slice(0, 10);

    const [{ data: mine }, { data: soon }, { data: mySeats }, { data: myRides }] = await Promise.all([
      sb.from("attendances").select("*, competitions(*)").eq("profile_id", profile.id),
      sb.from("competitions").select("*").gte("starts_on", today).order("starts_on").limit(4),
      sb.from("ride_seats").select("ride_id, rides!inner(competition_id)").eq("profile_id", profile.id),
      sb.from("rides").select("competition_id").eq("driver_id", profile.id),
    ]);

    const upcoming = (mine || [])
      .filter(a => a.competitions && (a.competitions.ends_on || a.competitions.starts_on) >= today)
      .sort((a, b) => a.competitions.starts_on.localeCompare(b.competitions.starts_on));

    // за кои състезания вече имам транспорт — като пътник или като шофьор
    const rideFor = new Set([
      ...(mySeats || []).map(s => s.rides?.competition_id),
      ...(myRides || []).map(r => r.competition_id),
    ].filter(Boolean));

    let html = profileNudge(profile);

    /* ---------- ВНИМАНИЕ ----------
       Всичко тук е сметнато от истински редове в базата.
       Няма правило, което да се задейства „просто така“.        */
    const alerts = [];
    for (const a of upcoming) {
      const c = a.competitions;
      const d = daysUntil(c.starts_on);
      const dl = daysUntil(c.registration_deadline);
      const link = `competition.html?id=${c.id}`;

      if (dl !== null && dl >= 0 && dl <= 14) {
        alerts.push({
          urgent: dl <= 3, ic: "!", href: c.registration_url || link,
          ext: Boolean(c.registration_url),
          title: dl === 0 ? `Днес изтича регистрацията за ${c.name}`
               : `Остават ${dl} ${dl === 1 ? "ден" : "дни"} за регистрация — ${c.name}`,
          sub: `Краен срок ${dateRange(c.registration_deadline)}`,
        });
      }
      if (a.looking_for_team && d !== null && d <= 45) {
        alerts.push({
          urgent: d <= 14, ic: "?", href: "team.html",
          title: `Още нямаш отбор за ${c.name}`,
          sub: d <= 14 ? `След ${d} ${d === 1 ? "ден" : "дни"} е. Крайно време е.`
                       : `След ${d} дни е. Сега е моментът да търсиш.`,
        });
      }
      const far = c.country !== "България" || (c.distance_km || 0) >= 120;
      if (far && !rideFor.has(c.id) && d !== null && d <= 45) {
        alerts.push({
          urgent: d <= 10, ic: "→", href: `${link}#travel`,
          title: `Нямаш уредено пътуване до ${c.city}`,
          sub: c.distance_km ? `${c.distance_km} км · ${c.name}` : c.name,
        });
      }
    }

    if (alerts.length) {
      html += `<div class="eyebrow">Внимание</div>`;
      html += alerts.map(al => `
        <a class="alert ${al.urgent ? "dg" : ""}" href="${esc(al.href)}"
           ${al.ext ? 'target="_blank" rel="noopener"' : ""}>
          <div class="ic">${esc(al.ic)}</div>
          <div class="tx"><b>${esc(al.title)}</b><span>${esc(al.sub)}</span></div>
          <div class="arw">›</div>
        </a>`).join("");
    }

    /* ---------- СЛЕДВАЩОТО ТИ ---------- */
    const next = upcoming[0];
    if (next) {
      const c = next.competitions;
      const d = daysUntil(c.starts_on);
      const { count: goingCount } = await sb.from("attendances")
        .select("*", { count: "exact", head: true }).eq("competition_id", c.id);
      const hasRide = rideFor.has(c.id);

      html += `<div class="eyebrow">Следващото ти</div>`;
      html += `
        <a class="next" href="competition.html?id=${c.id}" style="display:block;text-decoration:none">
          <span class="pill em">${esc(c.city)}</span>
          <div class="cd tnum">${d}<small>${d === 1 ? "ден" : "дни"}</small></div>
          <div class="d" style="font-size:17px">${esc(c.name)}</div>
          <div class="muted" style="margin-top:3px">${esc(dateRange(c.starts_on, c.ends_on))}</div>
          <div class="mini">
            <div><b>${goingCount ?? 0}</b><span>Отиват</span></div>
            <div><b style="color:${next.looking_for_team ? "var(--warn)" : "var(--ready)"}">${next.looking_for_team ? "?" : "✓"}</b><span>Отбор</span></div>
            <div><b style="color:${hasRide ? "var(--ready)" : "var(--warn)"}">${hasRide ? "✓" : "?"}</b><span>Транспорт</span></div>
          </div>
        </a>`;
    }

    /* ---------- ОТИВАТ С ТЕБ ----------
       Хората, записани на същите състезания като теб.            */
    const myCompIds = upcoming.map(a => a.competitions.id);
    if (myCompIds.length) {
      const { data: others } = await sb.from("attendances")
        .select("*, profiles(*)").in("competition_id", myCompIds);

      const compName = Object.fromEntries(upcoming.map(a => [a.competitions.id, a.competitions.name]));
      const seenP = new Set();
      const people = (others || [])
        .filter(r => r.profile_id !== profile.id && r.profiles?.name)
        .filter(r => { if (seenP.has(r.profile_id)) return false; seenP.add(r.profile_id); return true; });

      if (people.length) {
        html += `<div class="eyebrow">Отиват с теб
          <span style="color:var(--ash);letter-spacing:normal;font-family:inherit">${people.length}</span></div>`;
        html += `<div class="withyou">` + people.slice(0, 12).map(r => {
          const p = r.profiles;
          return `<a class="wy" href="competition.html?id=${r.competition_id}">
            <div class="ava ${r.looking_for_team ? "y" : "g"}">${esc(initials(p.name))}</div>
            <div class="nm">${esc(p.name)}</div>
            <div class="cm">${esc(compName[r.competition_id] || "")}</div>
            ${r.looking_for_team ? `<span class="pill em" style="margin-top:8px;font-size:10px;padding:3px 7px">Търси отбор</span>` : ""}
          </a>`;
        }).join("") + `</div>`;
      }
    }

    /* ---------- ПРЕДСТОЯЩИ ---------- */
    const mineIds = new Set(myCompIds);
    const other = (soon || []).filter(c => !mineIds.has(c.id));

    if (!next && !other.length) {
      html += `<div class="empty"><h3>Календарът е празен</h3>
        <p class="muted">Още няма въведени състезания. ${profile.is_admin
          ? `<a href="admin.html" style="color:var(--ember)">Добави първото →</a>`
          : "Скоро ще има."}</p></div>`;
    }

    if (other.length) {
      html += `<div class="eyebrow">Предстоящи <a href="competitions.html" style="color:var(--ember);text-decoration:none">Всички</a></div>`;
      html += other.map(c => `
        <a class="card" href="competition.html?id=${c.id}">
          <div class="comp">
            <div class="date"><b class="tnum">${dayNum(c.starts_on)}</b><span>${monthShort(c.starts_on)}</span></div>
            <div style="flex:1;min-width:0">
              <div class="nm">${esc(c.name)}</div>
              <div class="muted" style="margin-top:2px">${esc(c.city)}${c.country !== "България" ? ", " + esc(c.country) : ""}</div>
            </div>
          </div>
        </a>`).join("");
    }

    if (upcoming.length > 1) {
      html += `<div class="eyebrow">Другите ти състезания</div>`;
      html += upcoming.slice(1).map(a => {
        const c = a.competitions;
        return `<a class="card" href="competition.html?id=${c.id}">
          <div class="comp">
            <div class="date"><b class="tnum">${dayNum(c.starts_on)}</b><span>${monthShort(c.starts_on)}</span></div>
            <div style="flex:1;min-width:0">
              <div class="nm">${esc(c.name)}</div>
              <div class="muted" style="margin-top:2px">${esc(c.city)}</div>
            </div>
          </div>
        </a>`;
      }).join("");
    }

    if (profile.is_admin) {
      html += `<a class="btn ghost sm" href="admin.html" style="margin-top:16px">+ Добави състезание</a>`;
    }

    $("#root").innerHTML = html;
  }
}
</script>
</body>
</html>
